name: Deploy site to GitHub Pages
on:
  push:
    branches: [index.html, main]
    paths: ['walleye/**', 'index.html', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 */3 * * *'   # rebuild every 3 hours so the gauge / buoy / NWS data file stays fresh
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node walleye/scripts/test-reports.mjs
      - name: Fetch gauge, buoy, NWS text and any enabled report sources
        run: node walleye/scripts/fetch-reports.mjs
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
