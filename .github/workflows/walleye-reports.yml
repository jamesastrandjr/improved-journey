name: Refresh walleye reports
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours (GitHub only runs schedules from the default branch)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: walleye-reports
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node walleye/scripts/test-reports.mjs
      - name: Fetch reports, buoys and NWS text
        run: node walleye/scripts/fetch-reports.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add walleye/data/reports.json
          git diff --cached --quiet || (git commit -m "chore: refresh walleye reports [skip ci]" && git push)
